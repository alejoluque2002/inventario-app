<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Inventario</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="stylesheet" href="css/legal.css?v=1">
    <script src="js/tema.js"></script>
</head>
<body>

<main class="login-page">

    <div class="login-card">

        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            Inventario
        </div>

        <h1>Iniciar sesión</h1>

        <form id="loginForm">

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Entrar
            </button>

        </form>

        <p class="form-aviso">
            Tus datos se usan solo para gestionar tu acceso. Más información en la
            <a href="legal/privacidad.html">política de privacidad</a> y en las
            <a href="legal/condiciones.html">condiciones de uso</a>.
        </p>

    </div>

</main>

    <footer class="site-footer">
        <nav aria-label="Información legal">
            <a href="legal/aviso-legal.html">Aviso legal</a>
            <a href="legal/privacidad.html">Privacidad</a>
            <a href="legal/cookies.html">Cookies</a>
            <a href="legal/condiciones.html">Condiciones de uso</a>
            <a href="legal/seguridad.html">Seguridad</a>
        </nav>
    </footer>

<script src="js/config.js?v=2"></script>
<script src="js/login.js?v=2"></script>

</body>
</html>
